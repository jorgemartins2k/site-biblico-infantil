<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="cross" x1="64" y1="0" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>

  <!-- Open book pages -->
  <g fill="#F5F0E8" stroke="#3A6FB5" stroke-width="1.5">
    <!-- Left page -->
    <path d="M64 36 C64 36 56 30 44 32 C32 34 22 38 18 42 L18 80 C22 76 32 72 44 70 C56 68 64 72 64 72 Z"/>
    <!-- Right page -->
    <path d="M64 36 C64 36 72 30 84 32 C96 34 106 38 110 42 L110 80 C106 76 96 72 84 70 C72 68 64 72 64 72 Z"/>
  </g>

  <!-- Spine / center fold line -->
  <line x1="64" y1="36" x2="64" y2="76" stroke="#3A6FB5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cross on the book -->
  <g fill="url(#cross)">
    <rect x="60" y="45" width="8" height="20" rx="2"/>
    <rect x="55" y="49" width="18" height="8" rx="2"/>
  </g>

  <!-- Star sparkles (children's feel) -->
  <circle cx="88" cy="40" r="3" fill="#FFD700"/>
  <circle cx="92" cy="52" r="2" fill="#FFD700" opacity="0.7"/>
  <circle cx="40" cy="38" r="2.5" fill="#FFD700" opacity="0.8"/>
  <circle cx="36" cy="50" r="2" fill="#FFD700" opacity="0.6"/>
</svg>